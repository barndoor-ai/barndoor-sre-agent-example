apiVersion: v1
kind: Namespace
metadata:
  name: sre-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flux-capacitor
  namespace: sre-demo
  labels: {app: flux-capacitor}
spec:
  replicas: 1
  selector:
    matchLabels: {app: flux-capacitor}
  template:
    metadata:
      labels: {app: flux-capacitor}
    spec:
      containers:
        - name: flux-capacitor
          image: sre-example/app
          ports:
            - containerPort: 8000
          env:
            - {name: SERVICE_NAME, value: flux-capacitor}
            - {name: LOAD_RPS, value: "5"}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: flux-capacitor
  namespace: sre-demo
spec:
  selector: {app: flux-capacitor}
  ports:
    - port: 8000
      targetPort: 8000
