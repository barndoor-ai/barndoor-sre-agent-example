apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: sre-demo
  labels: {app: grafana}
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.1
          ports:
            - containerPort: 3000
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: sandbox-secrets, key: GRAFANA_ADMIN_PASSWORD}
            - {name: GF_SERVER_ROOT_URL, value: "http://localhost:3000"}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: sre-demo
spec:
  selector: {app: grafana}
  ports:
    - port: 3000
      targetPort: 3000
---
# Ephemeral public hostname (https://<random>.trycloudflare.com) in front of
# Grafana so the Barndoor-hosted Grafana connector can reach it. The hostname
# changes whenever this pod restarts; ../apply.sh reads the current one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnel
  namespace: sre-demo
  labels: {app: tunnel}
spec:
  replicas: 1
  selector:
    matchLabels: {app: tunnel}
  template:
    metadata:
      labels: {app: tunnel}
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2024.12.2
          args: ["tunnel", "--no-autoupdate", "--url", "http://grafana:3000"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
