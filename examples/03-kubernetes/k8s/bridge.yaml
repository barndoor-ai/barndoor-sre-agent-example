# The bridge runs ../../bridge/bridge.py from a ConfigMap the Tiltfile
# generates, so editing that file live-updates the pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge
  namespace: sre-demo
  labels: {app: bridge}
spec:
  replicas: 1
  selector:
    matchLabels: {app: bridge}
  template:
    metadata:
      labels: {app: bridge}
    spec:
      containers:
        - name: bridge
          image: python:3.12-slim
          command: ["python", "-u", "/bridge/bridge.py"]
          ports:
            - containerPort: 9095
          env:
            - {name: BRIDGE_PORT, value: "9095"}
            - {name: BOBI_INGEST_URL, value: "http://sre-agent:8080/webhooks/ingest/alert/firing"}
            - {name: KUBE_CONTEXT, value: sre-sandbox}
            - name: BRIDGE_TOKEN
              valueFrom:
                secretKeyRef: {name: sandbox-secrets, key: BRIDGE_TOKEN}
            - name: BOBI_INGEST_TOKEN
              valueFrom:
                secretKeyRef: {name: sandbox-secrets, key: BOBI_INGEST_TOKEN}
          readinessProbe:
            httpGet: {path: /healthz, port: 9095}
            periodSeconds: 5
          volumeMounts:
            - {name: code, mountPath: /bridge}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: code
          configMap: {name: bridge-code}
---
apiVersion: v1
kind: Service
metadata:
  name: bridge
  namespace: sre-demo
spec:
  selector: {app: bridge}
  ports:
    - port: 9095
      targetPort: 9095
