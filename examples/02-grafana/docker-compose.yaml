# Example 2: the sample app with real alerting.
#   app -> Prometheus -> Grafana alert rules -> webhook -> bridge -> agent
# plus a Cloudflare quick tunnel that gives Barndoor's Grafana connector a
# public HTTPS hostname for this Grafana.
#
# Start with ./up.sh: it exports the generated tokens this file interpolates.
name: sre-example-grafana

services:
  app:
    build: ../../app
    container_name: sre-example-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SERVICE_NAME: flux-capacitor
      LOAD_RPS: "5"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: sre-example-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: sre-example-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run ./up.sh}
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

  bridge:
    image: python:3.12-slim
    container_name: sre-example-bridge
    restart: unless-stopped
    command: ["python", "-u", "/bridge/bridge.py"]
    volumes:
      - ../../bridge:/bridge:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BRIDGE_PORT: "9095"
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:?run ./up.sh}
      BOBI_INGEST_URL: http://host.docker.internal:${SRE_EVENT_PORT:-8080}/webhooks/ingest/alert/firing
      BOBI_INGEST_TOKEN: ${BOBI_INGEST_TOKEN:?run ./up.sh}
    ports:
      - "9095:9095"

  # Ephemeral public hostname (https://<random>.trycloudflare.com) in front of
  # Grafana, so the Barndoor-hosted Grafana connector can reach it. The
  # hostname changes every time this container restarts; ./apply.sh reads
  # the current one from the logs.
  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    container_name: sre-example-tunnel
    restart: unless-stopped
    depends_on:
      - grafana
    command: ["tunnel", "--no-autoupdate", "--url", "http://grafana:3000"]

volumes:
  grafana-data:
